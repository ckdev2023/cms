services:
  - type: web
    name: jimusho-cms-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_MIGRATIONS_RUN
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: FILE_UPLOAD_DIR
        value: ./uploads
      - key: FILE_MAX_SIZE
        value: "10485760"
      # Set these after creating your Neon database
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: CORS_ORIGIN
        sync: false
    healthCheckPath: /api/v1/health
