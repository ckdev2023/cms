upstream cms_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen       80;
    server_name  _;

    root /opt/cms/frontend/dist;
    index index.html;

    client_max_body_size 55m;

    # ---------- gzip ----------
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/javascript
        application/json application/javascript
        image/svg+xml;
    gzip_vary on;

    # ---------- security headers ----------
    add_header X-Frame-Options    SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection   "1; mode=block" always;
    add_header Referrer-Policy     strict-origin-when-cross-origin always;

    # ---------- static assets (hashed by Vite) ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- API reverse proxy ----------
    location /api/ {
        proxy_pass         http://cms_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        proxy_buffering off;
    }

    # ---------- Swagger docs (dev/staging only) ----------
    location /api/docs {
        proxy_pass         http://cms_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---------- Vue Router history mode ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- deny dotfiles ----------
    location ~ /\. {
        deny all;
        return 404;
    }

    access_log /var/log/nginx/cms_access.log;
    error_log  /var/log/nginx/cms_error.log warn;
}
